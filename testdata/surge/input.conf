#!MANAGED-CONFIG https://example.com/surge.conf interval=86400 strict=false

[General]
loglevel = notify
dns-server = 223.5.5.5, 119.29.29.29

[Proxy]
On = direct
🇭🇰 HK 01 = ss, hk.example.com, 8388, encrypt-method=aes-128-gcm, password=p, obfs=http, obfs-host=bing.com, udp-relay=true, tfo=true
🇯🇵 JP VMess = vmess, jp.example.com, 443, username=7c8c8c0e-0000-4000-8000-000000000001, ws=true, ws-path=/ray, ws-headers=Host:jp.example.com|User-Agent:Mozilla, tls=true, sni=jp.example.com, vmess-aead=true
🇺🇸 US Trojan = trojan, us.example.com, 443, password=pw, sni=us.example.com, skip-cert-verify=true, server-cert-fingerprint-sha256=9e26352d9ef5a17e3c70380b7f4dfc9f5205484d7208ca9e4682ba1f81f3a366
SG Snell = snell, sg.example.com, 443, psk=k, version=4, obfs=tls, obfs-host=bing.com, reuse=true
SG Snell ShadowTLS = snell, sg.example.com, 8443, psk=k, version=4, shadow-tls-password=st, shadow-tls-sni=cover.example.com, shadow-tls-version=3
TW Hy2 = hysteria2, tw.example.com, 443, password=hy, sni=tw.example.com, download-bandwidth=200, port-hopping="20000-30000;40000", port-hopping-interval=30
KR TUIC = tuic-v5, kr.example.com, 443, uuid=7c8c8c0e-0000-4000-8000-000000000004, password=tu, alpn=h3, sni=kr.example.com
HTTPS Proxy = https, p.example.com, 443, user, pass, sni=p.example.com
SOCKS = socks5, 127.0.0.1, 1080
Chain = trojan, exit.example.com, 443, password=pw, underlying-proxy=🇭🇰 HK 01
WARP = wireguard, section-name=Cloudflare
Broken = vmess, , 443
External = external, exec = "/usr/bin/ssh"

[Proxy Group]
Proxy = select, Auto, 🇭🇰 HK 01, 🇯🇵 JP VMess, 🇺🇸 US Trojan, WARP, On
Auto = url-test, 🇭🇰 HK 01, 🇯🇵 JP VMess, TW Hy2, url=http://www.gstatic.com/generate_204, interval=600, tolerance=50, timeout=5
Fallback = fallback, 🇺🇸 US Trojan, KR TUIC, url=http://www.gstatic.com/generate_204, interval=300
Balance = load-balance, SG Snell, SG Snell ShadowTLS
HK = select, include-all-proxies=1, policy-regex-filter=HK|香港
Remote = select, policy-path=https://example.com/nodes.list
Home = subnet, default = Proxy, "SSID:Home" = DIRECT

[Rule]
RULE-SET,https://example.com/rules/reject.list,REJECT-TINYGIF
DOMAIN-SET,https://example.com/rules/proxy-domains.txt,Proxy
RULE-SET,LAN,DIRECT
RULE-SET,SYSTEM,DIRECT
DOMAIN-SUFFIX,google.com,Proxy
DOMAIN,example.org,Auto,extended-matching
DOMAIN-KEYWORD,netflix,Fallback
IP-CIDR,8.8.8.8/32,Proxy,no-resolve
IP-CIDR6,2001:4860::/32,Proxy,no-resolve
DEST-PORT,22,DIRECT
PROTOCOL,UDP,Balance
USER-AGENT,Telegram*,Proxy
AND,((DOMAIN-SUFFIX,example.com), (PROTOCOL,UDP)),REJECT
PROCESS-NAME,curl,On
GEOIP,CN,DIRECT
FINAL,Proxy,dns-failed

[WireGuard Cloudflare]
private-key = PRIV
self-ip = 172.16.0.2
self-ip-v6 = fd01::2
mtu = 1280
peer = (public-key = PUB, allowed-ips = "0.0.0.0/0, ::/0", endpoint = engage.cloudflareclient.com:2408, client-id = 1/2/3)

[URL Rewrite]
^https?://ad\.example\.com - reject

[MITM]
hostname = *.example.com
