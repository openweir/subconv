# A Clash config with what older Clash versions, other clients and careless hands write.
port: 7890
mode: rule
proxies:
  - {name: "HK 01", type: SS, server: hk.example.com, port: "8388", cipher: AEAD_AES_128_GCM, password: p, udp: "true"}
  - name: HK 01
    type: ss
    server: hk2.example.com
    port: 8389
    cipher: chacha20-poly1305
    password: 123456
    obfs: http
    obfs-host: bing.com
  - name: VMess legacy
    type: vmess
    server: vm.example.com
    port: 443
    uuid: 7c8c8c0e-0000-4000-8000-000000000001
    cipher: Auto
    tls: "true"
    sni: vm.example.com
    skip_cert_verify: "1"
    network: WS
    ws-path: /ray
    ws-headers: {Host: vm.example.com}
  - name: VLESS REALITY
    type: vless
    server: "[2001:db8::1]"
    port: 443
    uuid: 7c8c8c0e-0000-4000-8000-000000000002
    tls: true
    servername: www.microsoft.com
    fingerprint: chrome
    reality-opts: {publicKey: AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA, shortId: 1234}
    network: grpc
    grpc-opts: {serviceName: gun}
  - name: Trojan
    type: trojan
    server: t.example.com:8443
    password: pw
    servername: t.example.com
    interface-name: eth0
    routing-mark: 255
    alpn: h2,http/1.1
  - name: Hy2 hop
    type: hy2
    server: h.example.com
    ports: "20000:30000"
    password: hy
    hop-interval: 30s
    up: 50
    down: 200
  - name: Broken port
    type: trojan
    server: x.example.com
    port: 70000
    password: pw
  - name: No server
    type: ss
    port: 1
    cipher: aes-128-gcm
    password: p
  - name: Juicity
    type: juicity
    server: j.example.com
    port: 443
  - name: SS none
    type: ss
    server: none.example.com
    port: 80
    cipher: none
  - name: DIRECT
    type: socks5
    server: 127.0.0.1
    port: 1080
  - type: http
    server: p.example.com
    port: 3128
  - name: WG
    type: wireguard
    private-key: CgsMDQ4PEBESExQVFhcYGRobHB0eHyAhIiMkJSYnKCk=
    ip: 10.0.0.2/32
    udp: true
    peers:
      - {server: "w.example.com:51820", public-key: MjM0NTY3ODk6Ozw9Pj9AQUJDREVGR0hJSktMTU5PUFE=, allowed-ips: "0.0.0.0/0", reserved: "1,2,3"}
      - {server: w2.example.com, port: 51820, public-key: WltcXV5fYGFiY2RlZmdoaWprbG1ub3BxcnN0dXZ3eHk=, allowed-ips: [10.0.0.0/8]}
  - name: Naive
    type: naive
    server: n.example.com
    port: 443
    username: u
    password: p
    alpn: [h2]
  - name: Exit
    type: ss
    server: exit.example.com
    port: 8388
    cipher: aes-256-gcm
    password: p
    dialer-proxy: Missing
  - name: Client cert
    type: trojan
    server: c.example.com
    port: 443
    password: pw
    certificate: ./client.crt
    private-key: ./client.key
  - 42
proxy-providers:
  airport:
    type: http
    url: https://example.com/sub?token=t
    path: ./proxies/airport.yaml
    interval: 1h
    health-check: {enable: "true", url: "https://www.gstatic.com/generate_204", interval: "300"}
    filter: "(?i)hk|sg"
  local:
    type: file
    path: ./local.yaml
  broken:
    type: http
    url: not a url
proxy-groups:
  - name: Proxy
    type: Select
    proxies: [Auto, HK 01, HK 01 2, Gone, Broken port, DIRECT, Chain]
    use: [airport, local, nowhere]
  - name: Auto
    type: urltest
    proxies: [HK 01, VMess legacy, Loop]
    url: https://cp.cloudflare.com
    interval: 5m
    tolerance: "50"
  - name: Loop
    type: select
    proxies: [Auto, Trojan]
  - name: Empty
    type: fallback
    proxies: [No server, Juicity]
  - name: Chain
    type: relay
    proxies: [HK 01, VLESS REALITY, Trojan]
  - name: Balance
    type: load-balance
    strategy: round_robin
    proxies: [HK 01, Hy2 hop]
    dialer-proxy: HK 01
  - name: Home
    type: ssid
    proxies: [HK 01]
  - name: All
    type: select
    include-all: "yes"
    filter: "(?<=HK)"
rule-providers:
  reject:
    type: http
    behavior: Domain
    url: https://example.com/reject.txt
    path: ./ruleset/reject.yaml
    interval: 86400
  cn:
    type: http
    behavior: ip-cidr
    url: https://example.com/cn.mrs
  geosite-cn:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/SagerNet/sing-geosite/rule-set/geosite-cn.srs
  custom:
    type: http
    behavior: classical
    url: https://example.com/custom.json
  local:
    type: file
    behavior: domain
    path: ./local.yaml
  lan:
    type: inline
    behavior: classical
    payload:
      - DOMAIN-SUFFIX,lan
      - IP-CIDR,192.168.0.0/16,no-resolve
rules:
  - RULE-SET,reject,REJECT-TINYGIF
  - rule-set , cn , direct , no-resolve
  - RULE-SET,geosite-cn,DIRECT
  - RULE-SET,custom,Proxy
  - RULE-SET,local,DIRECT
  - RULE-SET,lan,DIRECT
  - HOST-SUFFIX,.google.com,Proxy
  - IP-CIDR,8.8.8.8,Proxy,no-resolve
  - IP-CIDR,not-an-ip,Proxy
  - DST-PORT,6000:6100,Chain
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  - OR,((DOMAIN,a.com),(RULE-SET,local)),Proxy
  - USER-AGENT,Telegram*,Proxy
  - DOMAIN,b.com,Empty
  - DOMAIN,c.com,Nobody
  - DOMAIN,d.com,proxy
  - SUB-RULE,(NETWORK,tcp),sub
  - MATCH,Proxy
  - DOMAIN,after.com,DIRECT
