[general]
server_check_url=http://www.gstatic.com/generate_204

[policy]
static=Proxy, Auto, HK SS, direct, img-url=https://example.com/proxy.png
url-latency-benchmark=Auto, HK SS, JP VMess, US Trojan, check-interval=600, tolerance=0
available=Fallback, US VLESS, JP VMess
round-robin=Balance, HK SS, US Trojan
static=HK, server-tag-regex=HK|香港, img-url=https://example.com/hk.png
ssid=Home, Proxy, direct, Home-WiFi:direct

[server_remote]
https://example.com/qx.list, tag=Airport, update-interval=86400, opt-parser=true, enabled=true

[server_local]
shadowsocks=hk.example.com:8388, method=aes-128-gcm, password=p, obfs=http, obfs-host=bing.com, fast-open=false, udp-relay=true, tag=HK SS
shadowsocks=hk.example.com:8389, method=chacha20-ietf-poly1305, password=p, obfs=wss, obfs-host=hk.example.com, obfs-uri=/ws, tag=HK SS WS
shadowsocks=sr.example.com:443, method=aes-256-cfb, password=p, ssr-protocol=auth_chain_a, ssr-protocol-param=1:p, obfs=plain, tag=SSR
vmess=jp.example.com:443, method=chacha20-ietf-poly1305, password=7c8c8c0e-0000-4000-8000-000000000001, obfs=wss, obfs-host=jp.example.com, obfs-uri=/ray, tls-verification=false, fast-open=false, udp-relay=false, tag=JP VMess
vmess=jp.example.com:8443, method=aes-128-gcm, password=7c8c8c0e-0000-4000-8000-000000000001, obfs=over-tls, obfs-host=jp.example.com, tag=JP VMess TLS
vless=us.example.com:443, method=none, password=7c8c8c0e-0000-4000-8000-000000000002, obfs=over-tls, obfs-host=www.microsoft.com, vless-flow=xtls-rprx-vision, reality-base64-pubkey=PUBKEY, reality-hex-shortid=abcd, tag=US VLESS
trojan=us.example.com:443, password=pw, over-tls=true, tls-host=us.example.com, tls-verification=true, fast-open=false, udp-relay=true, tag=US Trojan
http=p.example.com:443, username=u, password=p, over-tls=true, tls-host=p.example.com, tag=HTTPS
socks5=s.example.com:1080, username=u, password=p, tag=SOCKS

[filter_remote]
https://example.com/qx/ads.list, tag=Ads, force-policy=reject, update-interval=86400, opt-parser=false, enabled=true
https://example.com/qx/mixed.list, tag=Mixed, update-interval=86400, enabled=true

[filter_local]
host,www.google.com,Proxy
host-suffix,youtube.com,proxy
host-keyword,netflix,Auto
ip-cidr,10.0.0.0/8,direct
ip6-cidr,fd00::/8,direct
geoip,cn,direct
user-agent,Instagram*,proxy
final,Proxy

[rewrite_local]
^https?://ad\.example\.com url reject-200
