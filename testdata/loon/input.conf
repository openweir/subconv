[General]
ip-mode = dual

[Proxy]
HK SS = Shadowsocks,hk.example.com,8388,aes-128-gcm,"pass=word",obfs-name=http,obfs-host=bing.com,udp=true,fast-open=true
HK SS2022 = Shadowsocks,hk.example.com,8389,2022-blake3-aes-128-gcm,MDEyMzQ1Njc4OWFiY2RlZg==,udp=true
JP SSR = ShadowsocksR,jp.example.com,443,aes-128-cfb,"p",protocol=auth_aes128_md5,protocol-param=1:p,obfs=tls1.2_ticket_auth,obfs-param=jp.example.com
US VMess = vmess,us.example.com,443,aes-128-gcm,"7c8c8c0e-0000-4000-8000-000000000001",transport=ws,path=/ray,host=us.example.com,over-tls=true,tls-name=us.example.com,skip-cert-verify=true
US VLESS = VLESS,us.example.com,443,"7c8c8c0e-0000-4000-8000-000000000002",transport=tcp,over-tls=true,tls-name=www.microsoft.com,flow=xtls-rprx-vision,public-key=AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA,short-id=abcd
SG Trojan = trojan,sg.example.com,443,"pw",over-tls=true,tls-name=sg.example.com,transport=ws,path=/ws,host=sg.example.com
TW Hy2 = Hysteria2,tw.example.com,443,"hy",tls-name=tw.example.com,skip-cert-verify=false,download-bandwidth=100,salamander-password=ob
WG = wireguard,interface-ip=10.0.0.2,interface-ipv6=fd00::2,private-key=CgsMDQ4PEBESExQVFhcYGRobHB0eHyAhIiMkJSYnKCk=,mtu=1280,peers=[{public-key=MjM0NTY3ODk6Ozw9Pj9AQUJDREVGR0hJSktMTU5PUFE=,allowed-ips="0.0.0.0/0,::/0",endpoint=w.example.com:51820,reserved=[1,2,3]}]

[Remote Proxy]
Airport = https://example.com/loon.list,udp=true,fast-open=false,vless=true,enabled=true

[Proxy Chain]
Chain = HK SS,US VMess,udp=true

[Proxy Group]
Proxy = select,Auto,HK SS,US VMess,Chain,img-url=https://example.com/icon.png
Auto = url,HK SS,JP SSR,SG Trojan,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100
Fallback = fallback,US VLESS,TW Hy2,url=http://www.gstatic.com/generate_204,interval=300

[Remote Rule]
https://example.com/rules/ads.list, policy=REJECT, tag=Ads, enabled=true
https://example.com/rules/streaming.list, policy=Proxy, tag=Streaming, enabled=false
https://example.com/rules/mixed.list, tag=Mixed, enabled=true

[Rule]
DOMAIN-SUFFIX,google.com,Proxy
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
GEOIP,CN,DIRECT
FINAL,Proxy

[Plugin]
https://example.com/plugins/BlockAds.plugin, enabled=true
