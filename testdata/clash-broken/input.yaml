# One broken proxy and one broken rule must not take the rest of the subscription with them.
mixed-port: 7890
proxies:
  - name: HK 01
    type: ss
    server: hk.example.com
    port: 8388
    cipher: aes-128-gcm
    password: p
  - {name: "Broken, type: ss, server: x.example.com, port: 1}
  - name: JP 01
    type: trojan
    server: jp.example.com
    port: 443
    password: "pw"
	sni: tab-indented.example.com
  - name: US 01
    type: vmess
    server: us.example.com
    port: 443
    uuid: 7c8c8c0e-0000-4000-8000-000000000001
proxy-groups:
  - name: Proxy
    type: select
    proxies: [HK 01, JP 01, US 01]
rules:
  - DOMAIN-SUFFIX,google.com,Proxy
  - [unclosed
  - MATCH,Proxy
