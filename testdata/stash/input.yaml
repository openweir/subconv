# Stash's dialect of Clash: health checks named benchmark-*, and its own sections.
proxies:
  - {name: HK, type: ss, server: hk.example.com, port: 8388, cipher: aes-128-gcm, password: p}
  - {name: Hy1, type: hysteria, server: h.example.com, port: 443, auth-str: a, up-speed: 30, down-speed: 100, protocol: udp}
proxy-groups:
  - name: Auto
    type: url-test
    proxies: [HK, Hy1]
    benchmark-url: http://www.gstatic.com/generate_204
    benchmark-timeout: 5
    interval: 300
rules:
  - SCRIPT,quic,REJECT
  - DOMAIN-SUFFIX,google.com,Auto
  - MATCH,DIRECT
http:
  mitm: ["*.example.com"]
  rewrite: ["^https://ad.example.com - reject"]
