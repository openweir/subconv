# OpenWeir routing template, mirroring dler-io/Rules Clash/Rule.yaml.
# Ad blocking, a group for every service of the layout, Apple and mainland China; everything else through Others.
# Groups reach nodes through include-all and filter; {rules} is the URL of the rules branch.
# Schema: https://github.com/openweir/subconv/blob/main/docs/rules.md
proxy-groups:
  - name: "🚀 Proxy"
    type: select
    proxies: [♻️ Auto, DIRECT]
    include-all: true
    exclude-filter: (?i)expire|remaining|traffic|website|剩余|到期|过期|流量|官网|套餐|重置
  - name: "🎯 Domestic"
    type: select
    proxies: [DIRECT, "🚀 Proxy"]
  - name: "🐟 Others"
    type: select
    proxies: ["🚀 Proxy", "🎯 Domestic"]
  - name: "🛑 AdBlock"
    type: select
    proxies: [REJECT, DIRECT, "🚀 Proxy"]
