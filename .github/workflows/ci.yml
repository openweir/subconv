name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Under a minute. This leaves room for go test's own 10-minute limit per package to fire
    # first and print the hung goroutines.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...

  # Every push to main that passes the tests is released from its Conventional Commits: feat
  # bumps the minor version, fix and perf the patch; docs, refactor, test, ci and chore release
  # nothing. While the API settles the version stays below 1.0.0, so a breaking change bumps the
  # minor version too. The tag is what other modules require; the release has notes only.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Seconds. A stalled download takes up to 20 minutes, four 5-minute attempts, before it
    # fails; this leaves room for that and the rest of the run.
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      # go-semantic-release/action ran whatever semantic-release and plugins the project's registry
      # served as newest, unchecked. These are the same releases, pinned: each version is the newest
      # vX.Y.Z tag of github.com/go-semantic-release/<repository> (git ls-remote --tags), and each
      # SHA-256 is of that release's linux_amd64 asset, as its <repository>_v<version>_checksums.txt
      # lists it. Dependabot cannot see them: bump a version, its checksum and the matching flag
      # under Release together, by hand.
      - name: Download semantic-release and its plugins
        run: |
          fetch() { # repository version sha256 file
            curl -fsSL --retry 3 --max-time 300 -o "$4" \
              "https://github.com/go-semantic-release/$1/releases/download/v$2/$1_v$2_linux_amd64"
            echo "$3  $4" | sha256sum --check --strict -
            chmod +x "$4"
          }
          fetch semantic-release 2.31.0 b8f518b1aeb1d1742f4e6e91a179b707cea4309a64fe3854f465bf724f04f6d3 "$RUNNER_TEMP/semantic-release"
          # semantic-release runs a plugin it finds at .semrel/<os>_<arch>/<type>-<name>/<version>/.
          plugin() { # type-name repository version sha256
            mkdir -p ".semrel/linux_amd64/$1/$3"
            fetch "$2" "$3" "$4" ".semrel/linux_amd64/$1/$3/$2"
          }
          plugin condition-github condition-github 1.11.0 768ea08b520e2dee2f082b3f92d3c3c81a31bd586822a6dabd74d1dc8db0873d
          plugin provider-github provider-github 1.19.0 71bdcfdc169f3d9d9b8ea4f8b7f077dfa6725775073f2b9df6dc71f28c338509
          plugin commit-analyzer-default commit-analyzer-cz 1.15.0 992632c67f20338ff76dc81d7672f5eca51b8df3b690e5d0eb35ea4cf0a2de61
          plugin changelog-generator-default changelog-generator-default 1.15.0 166ba31b826f5e60d1b53a1190b2340e989295f35a28c45d668be1679b9b18ff

      # The flags the action passed, plus each plugin's exact version. With no batch prefetch and
      # a registry that never resolves (.invalid), a plugin not downloaded above fails the release
      # instead of being fetched unchecked.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          "$RUNNER_TEMP/semantic-release" \
            --version-file --changelog .generated-go-semantic-release-changelog.md \
            --token "$GITHUB_TOKEN" --allow-initial-development-versions \
            --ci-condition github@1.11.0 --provider github@1.19.0 \
            --commit-analyzer default@1.15.0 --changelog-generator default@1.15.0 \
            --plugin-resolver-disable-batch-prefetch --plugin-resolver-endpoint https://registry.invalid \
            || status=$?
          # 65 (nothing to release) and 66 (CI condition not met) are no failure. The action let any
          # 6x through; v2.31.0 uses only these two and exits with 1 on every other error
          # (cmd/semantic-release/main.go).
          case $status in 0 | 65 | 66) ;; *) exit "$status" ;; esac
