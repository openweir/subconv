name: Rules

# Rebuilds the rules branch (docs/rules.md) from its upstreams once a day. Scheduled workflows run
# from the default branch only, so this file lives on main, but it commits only to the rules
# branch: nothing reaches main's CI or releases, and pushes made with the workflow's token start
# no workflows.
on:
  schedule:
    - cron: "37 20 * * *" # 04:37 in China, off the hour when the scheduler is busiest
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }} # the generator's GitHub API calls, against the rate limit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # mihomo compiles the .mrs rule sets: the latest OpenWeir release, checked against its sums.
      - name: Download mihomo
        run: |
          dir="$RUNNER_TEMP/mihomo"
          gh release download --repo openweir/mihomo --dir "$dir" \
            --pattern 'mihomo-linux-amd64-v1-openweir-*.gz' --pattern sha256sums
          cd "$dir"
          archive=$(ls mihomo-linux-amd64-v1-openweir-*.gz)
          grep -E "  ${archive}\$" sha256sums | sha256sum -c -
          gunzip -c "$archive" > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Fetch the current branch's manifest
        run: |
          if git fetch --depth=1 origin rules; then
            git show FETCH_HEAD:manifest.json > "$RUNNER_TEMP/prev.json"
          fi

      - name: Build
        run: |
          go run ./cmd/rules -out "$RUNNER_TEMP/out" -mihomo "$RUNNER_TEMP/mihomo/mihomo" \
            -prev "$RUNNER_TEMP/prev.json" -changed "$RUNNER_TEMP/changed.txt"

      # One orphan commit, force-pushed: the rule sets change daily and their history is worth
      # nothing (the manifest records sources and dates), while keeping it would grow the
      # repository by megabytes a day.
      - name: Publish
        id: publish
        run: |
          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
            echo "Nothing changed."
            exit 0
          fi
          export GIT_INDEX_FILE="$RUNNER_TEMP/rules.index"
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git --work-tree="$RUNNER_TEMP/out" add --all
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "chore: rules $(date -u +%Y-%m-%d)")
          git push --force origin "$commit:refs/heads/rules"
          echo "published=true" >> "$GITHUB_OUTPUT"

      # purge.jsdelivr.net clears every jsDelivr hostname (cdn, fastly, testingcf, gcore). The
      # manifest goes last, so a client never sees a manifest whose files are still stale.
      # jsDelivr mirrors such as cdn.jsdmirror.com refetch from jsDelivr when their own cache
      # expires; clients check every file against the manifest either way.
      - name: Purge jsDelivr
        if: steps.publish.outputs.published == 'true'
        run: |
          while IFS= read -r path; do
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@rules/${path}"
            curl -fsS --retry 3 --max-time 30 -o /dev/null "$url" || echo "::warning::purge failed: $path"
          done < "$RUNNER_TEMP/changed.txt"

