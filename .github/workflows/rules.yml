name: Rules

# Rebuilds the rules branch (docs/rules.md) from its upstreams once a day. Scheduled workflows run
# from the default branch only, so this file lives on main, but it commits only to the rules
# branch: nothing reaches main's CI or releases, and pushes made with the workflow's token start
# no workflows.
#
# build runs the generator and mihomo, a binary from another repository, so it can read the
# repository and nothing more: it gets no token, and the one the runner holds for the job (which
# a hostile binary could dig out of memory) is read-only. It hands the branch over as an
# artifact. publish holds the write token; it checks out nothing and runs nothing it downloads,
# only commits the artifact's files, at the paths the branch has, and pushes them.
on:
  schedule:
    - cron: "37 20 * * *" # 04:37 in China, off the hour when the scheduler is busiest
  workflow_dispatch:

permissions: {}

concurrency:
  group: rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # The cache would be saved after mihomo ran, and restored by main's other workflows.
          cache: false

      # mihomo compiles the .mrs rule sets: the OpenWeir release cmd/rules/mihomo.pin names, which
      # must have the SHA-256 pinned there for this runner's platform.
      - name: Download mihomo
        run: |
          pin=cmd/rules/mihomo.pin
          platform="$(go env GOOS)/$(go env GOARCH)"
          tag=$(awk '$1 == "tag" { print $2 }' "$pin")
          asset=$(awk -v p="$platform" '$1 == p { print $2 }' "$pin")
          sum=$(awk -v p="$platform" '$1 == p { print $3 }' "$pin")
          if [ -z "$tag" ] || [ -z "$asset" ] || [ -z "$sum" ]; then
            echo "::error::$pin pins no mihomo for $platform"
            exit 1
          fi
          dir="$RUNNER_TEMP/mihomo"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL --retry 3 --max-time 300 -o "$asset" \
            "https://github.com/openweir/mihomo/releases/download/${tag}/${asset}"
          echo "$sum  $asset" | sha256sum --check --strict -
          gunzip -c "$asset" > mihomo
          chmod +x mihomo
          ./mihomo -v

      # The repository is public: the branch is fetched without credentials.
      - name: Fetch the current branch's manifest
        run: |
          if git fetch --depth=1 origin rules; then
            git show FETCH_HEAD:manifest.json > "$RUNNER_TEMP/prev.json"
          fi

      # The generator needs no token: it reads dler-io/Rules' head as git ls-remote does, not
      # through the GitHub API.
      - name: Build
        id: build
        run: |
          mkdir -p "$RUNNER_TEMP/artifact"
          go run ./cmd/rules -out "$RUNNER_TEMP/artifact/branch" -mihomo "$RUNNER_TEMP/mihomo/mihomo" \
            -prev "$RUNNER_TEMP/prev.json" -changed "$RUNNER_TEMP/artifact/changed.txt"
          if [ -s "$RUNNER_TEMP/artifact/changed.txt" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing changed."
          fi

      - name: Upload the branch
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rules
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rules
          path: ${{ runner.temp }}/artifact

      # One orphan commit, force-pushed: the rule sets change daily and their history is worth
      # nothing (the manifest records sources and dates), while keeping it would grow the
      # repository by megabytes a day.
      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          art="$RUNNER_TEMP/artifact"
          if [ ! -s "$art/changed.txt" ]; then
            echo "Nothing changed."
            exit 0
          fi

          # The artifact comes from a job that ran a downloaded binary: take regular files and
          # directories named in the branch's characters, at the branch's paths, and nothing else.
          # changed.txt names such paths too (removed files included); the purge puts them in URLs.
          cd "$art/branch"
          export LC_ALL=C
          paths='^(manifest\.json|template\.yaml|README\.md|NOTICE\.md|(LICENSES|providers)(/[A-Za-z0-9_-][A-Za-z0-9._-]*)+)$'
          odd=$(find . -mindepth 1 \( \( ! -type f ! -type d \) -o -name '.*' -o -name '*[!A-Za-z0-9._-]*' \) -print)
          stray=$({ find . -type f -printf '%P\n'; cat ../changed.txt; } | grep -Ev "$paths" || true)
          missing=$(for f in manifest.json template.yaml; do [ -f "$f" ] || echo "$f (missing)"; done)
          if [ -n "$odd$stray$missing" ]; then
            echo "::error::The artifact is not the rules branch:"
            printf '%s\n' "$odd" "$stray" "$missing" | sed '/^$/d; s/^/  /'
            exit 1
          fi

          git init --quiet --bare --initial-branch=rules "$RUNNER_TEMP/rules.git"
          export GIT_DIR="$RUNNER_TEMP/rules.git" GIT_WORK_TREE="$art/branch"
          export GIT_AUTHOR_NAME="github-actions[bot]" GIT_COMMITTER_NAME="github-actions[bot]"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git add --all
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "chore: rules $(date -u +%Y-%m-%d)")
          # The token reaches git through a credential helper that reads it from the environment:
          # never on a command line, never in a file.
          git -c credential.helper= \
            -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" "$commit:refs/heads/rules"
          echo "published=true" >> "$GITHUB_OUTPUT"

      # purge.jsdelivr.net clears every jsDelivr hostname (cdn, fastly, testingcf, gcore). The
      # manifest goes last, so a client never sees a manifest whose files are still stale.
      # jsDelivr mirrors such as cdn.jsdmirror.com refetch from jsDelivr when their own cache
      # expires; clients check every file against the manifest either way.
      - name: Purge jsDelivr
        if: steps.publish.outputs.published == 'true'
        run: |
          while IFS= read -r path; do
            url="https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@rules/${path}"
            curl -fsS --retry 3 --max-time 30 -o /dev/null "$url" || echo "::warning::purge failed: $path"
          done < "$RUNNER_TEMP/artifact/changed.txt"
